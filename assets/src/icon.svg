<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#2540B8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEFF"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1A5C" flood-opacity="0.45"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1A5C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS rounded-square canvas with standard margins -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>

  <!-- back sheet, peeking out to suggest a stack / history -->
  <rect x="352" y="318" width="400" height="500" rx="46" fill="#1B2E8F" opacity="0.55" transform="rotate(6 552 568)"/>

  <!-- clipboard board -->
  <g filter="url(#shadow)">
    <rect x="296" y="262" width="400" height="520" rx="48" fill="url(#paper)"/>
  </g>
  <!-- clip -->
  <rect x="416" y="214" width="160" height="104" rx="34" fill="#173087"/>
  <rect x="452" y="236" width="88" height="44" rx="22" fill="#2F55D4"/>

  <!-- text lines -->
  <rect x="356" y="384" width="280" height="30" rx="15" fill="#C3CFF6"/>
  <rect x="356" y="454" width="200" height="30" rx="15" fill="#C3CFF6"/>
  <rect x="356" y="524" width="250" height="30" rx="15" fill="#C3CFF6"/>
  <rect x="356" y="594" width="160" height="30" rx="15" fill="#C3CFF6"/>

  <!-- history badge: clock with a counter-clockwise arrow -->
  <g filter="url(#softShadow)">
    <circle cx="690" cy="712" r="128" fill="url(#badge)"/>
  </g>
  <!-- counter-clockwise arc from bottom-left around the right side, ending top-left with an arrowhead -->
  <path d="M 618 772 A 84 84 0 1 0 612 676" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <polygon points="594,652 642,674 598,707" fill="#FFFFFF"/>
  <!-- clock hands -->
  <line x1="690" y1="712" x2="690" y2="660" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="690" y1="712" x2="732" y2="736" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <circle cx="690" cy="712" r="14" fill="#FFFFFF"/>
</svg>
